# Dependabot — free, built into GitHub. Watches dependencies and opens Pull
# Requests for security fixes and version updates. Review + merge to apply.
version: 2
updates:
  # Python packages used by the build + agents (from requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "deps"

  # Versions of the GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
